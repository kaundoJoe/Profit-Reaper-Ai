<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner panel</title>
<style>:root{--g:#7dff4f}*{box-sizing:border-box}body{margin:0;background:#030503;color:#eef7ee;font:14px Arial;padding:14px;max-width:1100px;margin:auto}h1{color:var(--g);font-size:20px}h2{font-size:16px;margin:0 0 10px}
.card{background:#0a0f0a;border:1px solid #1f3a1f;border-radius:16px;padding:16px;margin:12px 0}input,select{width:100%;padding:11px;background:#111;border:1px solid #2f6b2f;border-radius:10px;color:#fff;margin:5px 0 10px}
.btn{background:var(--g);color:#04120a;border:0;border-radius:10px;padding:11px 16px;font-weight:bold;cursor:pointer}.btn.s{background:none;color:var(--g);border:1px solid var(--g);padding:6px 10px;font-size:12px}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.st div{background:#0e150e;border:1px solid #1f3a1f;border-radius:12px;padding:12px}.st b{display:block;font-size:20px;color:var(--g);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:7px 5px;border-bottom:1px solid #1f3a1f;text-align:left;vertical-align:top}th{color:#9fb3a0;font-weight:normal}.w{overflow:auto}
pre{background:#050805;border:1px solid #1f3a1f;border-radius:10px;padding:12px;white-space:pre-wrap;color:#9fe58a;font-size:13px}.y{color:var(--g)}.n{color:#ff8a8a}@media(max-width:700px){.st{grid-template-columns:1fr 1fr}}</style></head><body>
<h1>PROFIT REAPER · OWNER PANEL <a href="/app" style="font-size:12px;color:#9fb3a0">open bot</a></h1>
<div class="st"><div>Users<b id="sU">–</b></div><div>Activated<b id="sA">–</b></div><div>Revenue (recorded)<b id="sR">–</b></div><div>Signals<b id="sS">–</b></div></div>
<div class="card"><h2>Generate and send keys</h2><label>Plan</label><select id="plan"><option value="full">Paid $10: license + activation key</option><option value="activation">Paid $4: activation key (free-license holder)</option><option value="free-license">Free license key (referral reward)</option></select>
<input id="em" type="email" placeholder="Buyer email (keys are emailed and locked to this email)"><input id="nm" placeholder="Buyer name (optional)"><input id="cnt" type="number" value="1" min="1" max="20" placeholder="How many (free keys without email)"><input id="nt" placeholder="Note (e.g. EcoCash ref)">
<button class="btn" onclick="gen()">GENERATE</button><pre id="gout" style="display:none"></pre></div>
<div class="card"><h2>Record a payment</h2><input id="pe" type="email" placeholder="Email"><input id="pa" type="number" placeholder="Amount $"><input id="pn" placeholder="Note"><button class="btn" onclick="pay()">SAVE PAYMENT</button></div>
<div class="card"><h2>Clients</h2><div class="w"><table><thead><tr><th>Name</th><th>Email / phone</th><th>License</th><th>Activation</th><th>Paid</th><th>Last login</th><th>Status</th><th></th></tr></thead><tbody id="us"></tbody></table></div></div>
<div class="card"><h2>Email outbox</h2><div id="ob"></div></div>
<div class="card"><h2>Keys</h2><div class="w"><table><thead><tr><th>Key</th><th>Type</th><th>Issued to</th><th>Used by</th><th></th></tr></thead><tbody id="ks"></tbody></table></div></div>
<script>
const $=i=>document.getElementById(i),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),D=t=>t?new Date(t).toLocaleString():'never';
async function api(p,b){const r=await fetch(p,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});const j=await r.json().catch(()=>({}));if(r.status===401||r.status===403)location='/';if(!r.ok)throw Error(j.error||'Error');return j}
async function load(){const d=await api('/api/admin/overview');$('sU').textContent=d.users.length;$('sA').textContent=d.users.filter(u=>u.activated).length;$('sR').textContent='$'+d.revenue;$('sS').textContent=d.signals;
 $('us').innerHTML=d.users.map(u=>`<tr><td>${E(u.name)} ${E(u.surname)}${u.role==='owner'?' (owner)':''}</td><td>${E(u.email)}<br>${E(u.phone)} ${E(u.country)}</td><td>${E(u.license)}</td><td>${E(u.activation)||'<span class=n>none</span>'}</td><td class="${u.paid?'y':'n'}">${u.paid?'$'+u.paid:'unpaid'}</td><td>${D(u.lastLogin)}</td><td class="${u.activated?'y':'n'}">${u.suspended?'suspended':u.activated?'active':'not activated'}</td><td>${u.role==='owner'?'':`<button class="btn s" onclick="sus('${E(u.email)}')">${u.suspended?'Unsuspend':'Suspend'}</button>`}</td></tr>`).join('');
 $('ob').innerHTML=d.outbox.map(o=>`<div style="border-bottom:1px solid #1f3a1f;padding:8px 0"><b>${E(o.to)}</b> · ${D(o.t)} · <span class="${o.status==='sent'?'y':'n'}">${E(o.status)}</span><br><a style="color:#7dff4f" href="mailto:${encodeURIComponent(o.to)}?subject=${encodeURIComponent(o.subject)}&body=${encodeURIComponent(o.text)}">Open in email app</a> · <a style="color:#7dff4f" href="https://wa.me/?text=${encodeURIComponent(o.text)}">Send via WhatsApp</a></div>`).join('')||'None';
 $('ks').innerHTML=d.keys.map(k=>`<tr><td>${E(k.key)}</td><td>${E(k.kind)} · ${E(k.type)}${k.price?' $'+k.price:''}</td><td>${E(k.issuedTo)||'-'}</td><td>${E(k.boundTo)||'-'}</td><td><button class="btn s" onclick="rev('${E(k.key)}')">${k.revoked?'Restore':'Revoke'}</button></td></tr>`).join('')}
async function gen(){try{const r=await api('/api/admin/keys',{plan:$('plan').value,email:$('em').value,name:$('nm').value,count:$('cnt').value,note:$('nt').value});$('gout').style.display='block';$('gout').textContent=r.keys.map(k=>k.label+': '+k.key).join('\n')+'\n\nEmail: '+r.mail;load()}catch(e){alert(e.message)}}
async function pay(){try{await api('/api/admin/payment',{email:$('pe').value,amount:$('pa').value,note:$('pn').value});$('pe').value=$('pa').value=$('pn').value='';load()}catch(e){alert(e.message)}}
async function sus(e){await api('/api/admin/suspend',{email:e});load()}async function rev(k){await api('/api/admin/revoke',{key:k});load()}
load();setInterval(load,30000);
</script></body></html>
