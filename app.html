<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard - Profit Reaper</title><style>body{font-family:Arial;background:#0a0a0a;color:#fff;text-align:center;padding:20px}.card{background:#1a1a1a;padding:20px;border-radius:15px;max-width:520px;margin:15px auto}button{background:#00e676;color:#000;padding:12px;border:none;border-radius:10px;font-weight:bold;width:100%;margin-top:10px}select{width:95%;padding:12px;border-radius:10px}.box{background:#000;padding:12px;border-radius:10px;text-align:left;margin-top:10px}</style></head><body>
<h1>💀 DASHBOARD</h1><p id="welcome"></p><p id="lic"></p>
<div class="card"><h3>Analyze Any Symbol - REAL Deriv</h3><select id="sym"><option>Volatility 75 Index</option><option>Volatility 100 Index</option><option>Volatility 50 Index</option><option>Volatility 25 Index</option><option>Boom 1000 Index</option><option>Crash 1000 Index</option><option>Boom 500 Index</option><option>Crash 500 Index</option><option>Step Index</option><option>Jump 75 Index</option><option>EUR/USD</option><option>GBP/USD</option><option>BTC/USD</option><option>Gold (XAU/USD)</option></select><button onclick="analyze()">Analyze Live</button><div id="res" class="box">Pick a symbol and tap Analyze</div></div>
<div class="card"><h3>Scan ALL Symbols</h3><button onclick="scanAll()">Scan All - Strong Signals Only</button><div id="scan" class="box">Only shows CALL/PUT with 65%+ confidence</div></div>
<div class="card"><h3>Recent Signals</h3><div id="hist" class="box">Loading...</div></div>
<button onclick="logout()" style="background:#ff5252;color:#fff;max-width:520px">Logout</button>
<script>
let u=JSON.parse(localStorage.getItem('pr_user')||'null');if(!u){location.href='/'}else{welcome.innerText='Welcome '+u.user.name+' ('+u.user.email+')';lic.innerText=u.licenses.length?('License: '+u.licenses[0].key+' - '+u.licenses[0].status+' - '+u.licenses[0].plan):'No license';}
async function analyze(){res.innerText='Fetching live Deriv candles...';let r=await fetch('/api/signal?symbol='+encodeURIComponent(sym.value));let j=await r.json();let s=j.signal;res.innerHTML='<b>'+s.pair+'</b><br><h2>'+s.direction+' - '+s.confidence+'%</h2>Price: '+s.price+' | RSI: '+s.rsi+' | EMA20: '+s.ema20+' | EMA50: '+s.ema50+'<br>'+(s.reason||'')+'<br><small>'+s.time+'</small>';loadHist()}
async function scanAll(){scan.innerText='Scanning 28 symbols live... this takes ~20 sec';let r=await fetch('/api/analyze-all');let j=await r.json();if(!j.strong.length){scan.innerHTML='No strong signals right now. Market is choppy - WAIT.';return}scan.innerHTML=j.strong.map(s=>'<b>'+s.pair+'</b> - '+s.direction+' '+s.confidence+'% (RSI '+s.rsi+')<br>'+s.reason).join('<hr>')}
async function loadHist(){let r=await fetch('/api/signals');let j=await r.json();hist.innerHTML=j.signals.map(s=>s.pair+' - '+s.direction+' '+s.confidence+'% - '+s.time).join('<br>')||'No signals yet'}
function logout(){localStorage.removeItem('pr_user');location.href='/'}loadHist();
</script></body></html>
